name: secure-ai-review

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secure-ai-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run deterministic AI-assisted code security gate
        run: python scripts/ai_code_review_gate.py src examples docs README.md --fail-on high
      - name: Run tests
        run: |
          python -m pip install -e '.[dev]'
          python -m pytest tests
